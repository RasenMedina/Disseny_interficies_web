<!DOCTYPE html>
<html lang="ca">
<head>
    <!-- Codificació de caràcters que permet accents i caràcters especials -->
    <meta charset="UTF-8">
    
    <!-- Perquè la pàgina s'adapti a l'amplada del dispositiu corresponent (responsivitat) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Títol de la pàgina: important per SEO -->
    <title>Iniciar sessió o registrar-se | RAS Football</title>
    
    <!-- Descripció de la web pels cercadors -->
    <meta 
      name="description"
      content="Inicia sessió o crea un compte a RAS Football."
    >

    <!-- Autor del projecte -->
    <meta name="author" content="Rasen Mediñà i Masdeu">

    <!-- Idioma i indexació: l'idioma principal ja s'indica a html lang="ca" -->
    <meta name="robots" content="index, follow">

    <!-- Full d'estils generat per Tailwind CSS -->
    <link rel="stylesheet" href="./css/output.css">
</head>

<!-- El body amb un color de fons blanc -->
<body class="bg-slate-100">

  <!-- Capçalera principal amb un fons blau fosc personalitzat [#123D68], text en blanc i padding 6 (24px) -->
  <header class="bg-[#123D68]  text-white p-6">
    <!-- Flex que distribueix el logotip i el botó als dos extrems (justify-between)-->
    <div class="flex items-center justify-between gap-4">
      
      <!-- Logotip de RAS Football que enllaça amb la vista 'Home': afegim espai interior horitzontal i vertical, arrodonim cantonades -->
      <!-- aria-label proporciona un nom accessible que pot anunciar el lector de pantalla --> 
      <!-- Posem un fons clar perquè destaqui el logotip, cantonades arrodonides (xl), 16px de pàdding horitzontal (px-4), 8 píxels de padding vertical (py-2) -->
      <a 
        href="index.html" 
        aria-label="RAS Football - Pàgina d'inici"
        class="bg-slate-100 rounded-xl px-4 py-2">
            
        <!-- Imatge del logotip: establim un amplada de 128 píxels (w-32) i calculem automàticament l'alçada (h-auto) -->
        <img
            src="./assets/images/logo.svg"
            alt="Logotip de RAS Football"
            class="w-32 h-auto"
        >
      </a>

      <!-- Botó que enllaçarà amb la vista de 'Home': el botó s'enfosqueix quan hi passem el ratolí -->
      <!-- Posem un fons clar, text blau fosc, en negreta, padding horitzontal (px-6), padding vertical (py-3), cantonades arrodonides -->
    <!-- El símbol de fletxa indica visualment el retorn -->
      <a href="index.html"
        class="bg-slate-100 hover:bg-slate-200 text-[#123D68] font-bold px-6 py-3 rounded-full">
        &larr; TORNAR
      </a>
    </div>
  </header>

<!-- Contingut principal de la vista 'Login' -->
<!-- max-w-5xl limita l'amplada, mx-auto centra el contingut -->
<!-- px-4 i py-10 afegeixen espai interior -->
<main class="max-w-5xl mx-auto px-4 py-10">

    <!-- Contenidor dels dos formularis -->
    <!-- Fons blanc per destacar sobre el gris clar del body -->
    <div class="bg-white rounded-lg p-6 md:p-10">

        <!-- Grid dels formularis -->
        <!-- En mòbil: una columna (grid-cols-1)-->
        <!-- A partir de md: dues columnes (grid-cols-2) -->
        <!-- gap-10 separa els dos formularis -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

            <!-- FORMULARI 1: INICIAR SESSIÓ -->
            <section aria-labelledby="titol-login">

                <!-- Títol del formulari -->
                <h1
                    id="titol-login"
                    class="text-2xl font-bold text-[#123D68] text-center mb-8"
                >
                    INICIAR SESSIÓ
                </h1>

                <!-- Formulari d'inici de sessió -->
                <!-- FORMULARI ENCARA NO FUNCIONAL -->
                <!-- <form> agrupa els camps d'un formulari -->
                <!-- space-y-5 separa verticalment els elements fills -->
                <form action="#" method="post" class="space-y-5">

                    <!-- Camp: correu electrònic -->
                    <div>
                        <!-- <label> identifica què ha d'escriure l'usuari -->
                        <label
                            for="login-email"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Correu electrònic
                        </label>

                        <!-- <input> permet introduir dades -->
                        <!-- És obligatori (required) -->
                        <!-- w-full ocupa tota l'amplada disponible -->
                        <!-- md:border-l dibuixa la línia vertical en pantalles mitjanes o grans -->
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            autocomplete="email"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Camp: contrasenya -->
                    <div>
                        <label
                            for="login-password"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Contrasenya
                        </label>

                        <!-- type="password" oculta els caràcters escrits -->
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            autocomplete="current-password"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Casella: recordar-me -->
                    <!-- Flex situa la casella i el text en horitzontal -->
                    <div class="flex items-center gap-2">
                        <input
                            type="checkbox"
                            id="recordar"
                            name="recordar"
                            class="w-4 h-4"
                        >

                        <label
                            for="recordar"
                            class="text-sm text-[#123D68]"
                        >
                            Recorda'm
                        </label>
                    </div>

                    <!-- Botó: iniciar sessió -->
                    <!-- type=submit intenta enviar el formulari -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-full"
                    >
                        INICIAR SESSIÓ
                    </button>

                    <!-- Enllaç: per recuperar la contrasenya -->
                    <!-- Pendent de crear la funcionalitat -->
                    <p class="text-sm text-center text-blue-600">
                        Has oblidat la contrasenya?
                    </p>
                </form>
            </section>

            <!-- FORMULARI 2: REGISTRE -->
            <!-- border-l afegeix la línia vertical en pantalles md -->
            <!-- pl-10 separa el contingut de la línia -->
            <section
                aria-labelledby="titol-registre"
                class="md:border-l md:border-slate-300 md:pl-10"
            >
                <h2
                    id="titol-registre"
                    class="text-2xl font-bold text-[#123D68] text-center mb-8"
                >
                    REGISTRE
                </h2>

                <!-- Formulari de registre -->
                <form action="#" method="post" class="space-y-5">

                    <!-- Camp: nom d'usuari -->
                    <div>
                        <label
                            for="registre-usuari"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Nom d'usuari
                        </label>

                        <input
                            type="text"
                            id="registre-usuari"
                            name="usuari"
                            autocomplete="username"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Camp: correu electrònic -->
                    <div>
                        <label
                            for="registre-email"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Correu electrònic
                        </label>

                        <!-- És obligatori (required) -->
                        <input
                            type="email"
                            id="registre-email"
                            name="email"
                            autocomplete="email"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Camp: contrasenya -->
                    <div>
                        <label
                            for="registre-password"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Contrasenya
                        </label>

                        <input
                            type="password"
                            id="registre-password"
                            name="password"
                            autocomplete="new-password"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Camp: repetir contrasenya -->
                    <div>
                        <label
                            for="registre-confirmar"
                            class="block font-bold text-[#123D68] mb-2"
                        >
                            Repetir contrasenya
                        </label>

                        <input
                            type="password"
                            id="registre-confirmar"
                            name="confirmar_password"
                            autocomplete="new-password"
                            required
                            class="w-full bg-slate-100 rounded-lg px-4 py-3 border border-slate-300"
                        >
                    </div>

                    <!-- Casella: acceptació dels termes i condicions -->
                    <div class="flex items-center gap-2">

                        <input
                            type="checkbox"
                            id="termes"
                            name="termes"
                            required
                            class="w-4 h-4"
                        >

                        <label
                            for="termes"
                            class="text-sm text-[#123D68]"
                        >
                            Accepto els termes i condicions
                        </label>
                    </div>

                    <!-- Botó: registre -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-full"
                    >
                        CREAR COMPTE
                    </button>
                </form>
            </section>
        </div>
    </div>
  </main>

  <!-- Peu de pàgina -->
  <footer id="sobre-nosaltres" class="bg-[#123D68] text-white mt-8">

    <!--
        max-w-7xl: limita l'amplada del contingut
        mx-auto: centra el contenidor
        px-6 py-8: espai interior
    -->
    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Distribució dels elements del footer -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 text-center">

            <!-- Identitat i autoria -->
            <div>
                <p class="font-bold">RAS Football</p>
                <p class="text-xs">
                    Projecte personal de Rasen Mediñà i Masdeu
                </p>
            </div>

            <!-- Navegació complementària -->
            <div class="flex flex-wrap justify-center gap-6 text-sm">

                <a href="index.html" class="hover:underline">
                    Inici
                </a>

                <a href="mailto:r.medina@sapalomera.cat" class="hover:underline">
                    Contacte
                </a>

                <a href="#sobre-nosaltres" class="hover:underline">
                    Sobre nosaltres
                </a>
            </div>

            <!-- Copyright -->
            <p class="text-sm">
                &copy; 2026 RAS Football
            </p>
        </div>
    </div>
  </footer>
</body>
</html>
